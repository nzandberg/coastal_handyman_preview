image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html public/index.html
    - find . -maxdepth 1 -type f \( -iname '*.html' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.pdf' \) -exec cp {} public/ \;
  artifacts:
    paths:
      - public
  only:
    - main
